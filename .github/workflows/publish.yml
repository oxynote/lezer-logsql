name: Publish

# publishes the package for a tag, and only once every gate passes. The
# tag v0.1.0 publishes @oxynote/lezer-logsql@0.1.0.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  qa:
    uses: ./.github/workflows/qa.yml

  publish:
    name: Publishing to npm
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm authenticates this job by its own workflow identity, trusted
      # publishing, so there is no token to store. The same identity signs
      # the provenance attestation.
      id-token: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile

      # dist/ is gitignored, so the files being published are built here
      # and not taken from the checkout.
      - name: Building the package
        run: pnpm run build

      # the tag is the source of truth. A mismatch means the version bump was
      # forgotten, which would publish the previous version's number again.
      - name: Checking the tag against the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [[ "$tag" != "$manifest" ]]; then
            echo "tag $tag does not match package.json $manifest" >&2
            exit 1
          fi

      # trusted publishing needs a recent npm, so npm itself publishes
      - name: Publishing
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance
