name: QA

on:
  # the publish workflow runs every gate on a tag and publishes only once
  # they all pass, so this one has to be callable.
  workflow_call:
  push:
    branches:
      - main
  pull_request:

# a newer push supersedes the still-running workflow of the stale commit
# and cancels it.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile

      - name: Run check-lint
        run: pnpm run check-lint

  test:
    name: Testing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      # the package is what consumers load, so the built files are imported
      # once in plain Node, outside the test runner.
      - name: Building the package
        run: pnpm run build

      - name: Loading the built package
        run: |
          node --input-type=module -e '
            import { parser } from "./dist/index.js"
            const tree = parser.parse("_time:5m error | stats count()")
            if (tree.toString().includes("⚠")) throw new Error(tree.toString())
          '

  upstream:
    # the tests trust upstream/queries.json and test/victorialogs-answers.json
    # for what valid LogsQL is. This job writes both again from a real
    # VictoriaLogs and fails when the committed ones differ, so the record
    # cannot drift or be edited by hand.
    name: Checking the record against VictoriaLogs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Installing dependencies
        run: pnpm install --frozen-lockfile

      - name: Generating the parser
        run: pnpm run generate

      - name: Starting VictoriaLogs
        run: ./scripts/start-victorialogs.sh "$(cat upstream/VERSION)"

      - name: Writing the record again
        run: pnpm run sync-upstream "$(cat upstream/VERSION)"

      - name: Comparing it with the committed record
        run: git diff --exit-code -- upstream test/victorialogs-answers.json
